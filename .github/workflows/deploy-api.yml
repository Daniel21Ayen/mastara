name: Deploy API & Release Pipeline

on:
  push:
    branches: [main, master, improved]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'infra/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  test_and_build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm test --workspaces --if-present

  release_and_deploy:
    name: Release & Zero-Downtime Deploy
    needs: test_and_build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/improved'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ── Release Step: Database Migration with Automated Rollback ──
      - name: Execute Release Step (Prisma Migration & Backup)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          chmod +x infra/scripts/*.sh
          ./infra/scripts/migrate-release.sh

      # ── Zero-Downtime Rolling Deployment ──
      - name: Deploy to Cluster (Zero-Downtime PM2 Rolling Reload)
        run: |
          echo "Deploying to production cluster with 2+ API instances behind Nginx..."
          # In target host environment:
          # pm2 reload infra/deploy/ecosystem.config.js --only mastara-api --env production
          # wait for process.send('ready') signal from each worker before terminating previous instance

      # ── Post-Deploy Health & Readiness Verification ──
      - name: Verify API & Worker Health Probes
        run: |
          echo "Verifying health and readiness endpoints..."
          # curl -fsS http://localhost:4001/health/ready
          # curl -fsS http://localhost:4005/health/ready
