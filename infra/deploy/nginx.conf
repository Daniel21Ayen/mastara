# ─────────────────────────────────────────────────────────────────
# Mastara — Nginx Reverse Proxy Config
# ─────────────────────────────────────────────────────────────────

# Shared upstream definitions
upstream api {
    server 127.0.0.1:4001;
    keepalive 32;
}

upstream admin_web {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ── Rate-limit zones ──────────────────────────────────────────────
# General API limit: 30 req/s per IP
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
# Auth endpoints: stricter — 5 req/s per IP
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────
server {
    listen 80;
    server_name api.mastara.app admin.mastara.app;
    return 301 https://$host$request_uri;
}

# ── API — api.mastara.app ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.mastara.app;

    # TLS (update paths to real certs — e.g. Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.mastara.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mastara.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options         DENY              always;
    add_header X-Content-Type-Options  nosniff           always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy         strict-origin     always;

    # Request body limit (file uploads go through MinIO directly)
    client_max_body_size 10m;

    # Auth routes — strict rate limit
    location ~* ^/api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # All other API routes
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://api;
        access_log off;
    }
}

# ── Admin Web — admin.mastara.app ─────────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.mastara.app;

    ssl_certificate     /etc/letsencrypt/live/admin.mastara.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mastara.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Frame-Options         SAMEORIGIN        always;
    add_header X-Content-Type-Options  nosniff           always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js static files — long cache
    location /_next/static/ {
        proxy_pass http://admin_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # All other pages
    location / {
        proxy_pass         http://admin_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
