services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: mastara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mastara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mastara_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mastara}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - mastara_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mastara} -d ${POSTGRES_DB:-mastara}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mastara-network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: mastara-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--requirepass", "${REDIS_PASSWORD:-mastara_redis_pass_2026}"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - mastara_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mastara_redis_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mastara-network

