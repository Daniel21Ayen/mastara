services:
  postgres:
    image: postgres:16-alpine
    container_name: mastara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mastara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mastara_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mastara}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - mastara_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mastara} -d ${POSTGRES_DB:-mastara}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mastara-network

  redis:
    image: redis:7-alpine
    container_name: mastara-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-mastara_redis_pass_2026}"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - mastara_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mastara_redis_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mastara-network

  minio:
    image: minio/minio:RELEASE.2024-10-02T01-58-21Z
    container_name: mastara-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mastara_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mastara_minio_pass_2026}
    ports:
      - "${MINIO_API_HOST_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9003}:9001"
    volumes:
      - mastara_minio_data:/data
    networks:
      - mastara-network

volumes:
  mastara_pg_data:
    name: mastara_pg_data
  mastara_redis_data:
    name: mastara_redis_data
  mastara_minio_data:
    name: mastara_minio_data

networks:
  mastara-network:
    name: mastara-network
    driver: bridge
